name: 指数基金定投日报

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy requests schedule curl_cffi lxml
      - name: Run
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          sed -i 's|FEISHU_WEBHOOK_URL = ""|FEISHU_WEBHOOK_URL = "'"$FEISHU_WEBHOOK"'"|' config.py
          python3 main.py --once
