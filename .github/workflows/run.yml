name: 007466 定投日报

on:
  schedule:
    - cron: '0 0 * * 1-5'   # UTC 0:00 = 北京时间 8:00
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas numpy requests schedule curl_cffi lxml
      - name: Run
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          sed -i 's|FEISHU_WEBHOOK_URL = ""|FEISHU_WEBHOOK_URL = "'"$FEISHU_WEBHOOK"'"|' config.py
          python3 main.py --once
